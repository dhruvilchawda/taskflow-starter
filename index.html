<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A simple task manager"><title>TaskFlow — Task Manager</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><header><span class="tag">YOUR DAILY WORKSPACE</span><h1>TaskFlow<span class="dot">.</span></h1><p class="subtitle">Stay organized, focus on what matters, and make progress every day.</p></header><section class="stats"><div class="stat">Total<strong id="total">0</strong></div><div class="stat">Active<strong id="active">0</strong></div><div class="stat">Completed<strong id="completed">0</strong></div></section><section class="panel"><h2>Your tasks</h2><form id="task-form"><input id="task-title" type="text" maxlength="120" required placeholder="What needs to be done?" aria-label="Task title"><select id="priority" aria-label="Priority"><option value="medium">Medium</option><option value="low">Low</option><option value="high">High</option></select><input id="due-date" type="date" aria-label="Due date"><button type="submit">+ Add task</button></form><div class="toolbar"><div class="filters"><button type="button" class="selected" data-filter="all">All</button><button type="button" data-filter="active">Active</button><button type="button" data-filter="completed">Completed</button></div><input id="search" type="search" placeholder="Search tasks..." aria-label="Search tasks"></div><ul id="task-list"></ul><p id="empty">No tasks yet. Add one to get started.</p><button class="clear" id="clear-completed" type="button">Clear completed</button><p id="message" role="status"></p></section><footer>Made with HTML, CSS & JavaScript · Tasks are saved in this browser.</footer></main><script src="app.js" defer></script></body></html>
